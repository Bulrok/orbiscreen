# ─────────────────────────────────────────────
# Orbiscreen - Linux Desktop GUI
# https://github.com/shadow-x78/orbiscreen
# ─────────────────────────────────────────────

[package]
name = "orbiscreen-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Orbiscreen Linux Host Control Center (native GTK4 + libadwaita)"

[dependencies]
orbiscreen-core = { path = "../orbiscreen-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
qrcode = { version = "0.14", default-features = false }
ksni = "0.3"
async-channel = "2"

[lints]
workspace = true
